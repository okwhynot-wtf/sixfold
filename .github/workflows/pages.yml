name: Publish website
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "paper/**"
      - "output/pdf/**"
      - "site/**"
      - "scripts/build_site.py"
      - "site-requirements.txt"
      - ".github/workflows/pages.yml"
      - "research/sixfold/**"
      - "verification/visuals-edition-01.json"
      - "scripts/check_visuals.py"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r site-requirements.txt
      - run: python scripts/build_site.py
      - run: python scripts/check_visuals.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
