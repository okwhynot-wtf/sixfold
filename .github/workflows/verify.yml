name: Verify mathematical computations
on:
  push:
    branches: [main]
    paths:
      - "research/fractal_handover/**"
      - "research/fractal_research_08/**"
      - "research/fractal_research_09/**"
      - "research/fractal_research_10_topology/**"
      - "scripts/verify.py"
      - "requirements.txt"
      - ".github/workflows/verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify.py --receipt .build/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .build/verification.json
